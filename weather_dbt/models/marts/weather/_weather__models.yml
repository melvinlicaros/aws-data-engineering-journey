version: 2

models:
  - name: weather_hourly
    description: "One row per location per hour, keeping only the latest forecast. Use for current forecast reporting and dashboards."
    columns:
      - name: observed_at
        data_tests:
          - not_null
      - name: latitude
        data_tests:
          - not_null
      - name: temperature_c
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null
      - name: humidity_pct
        data_tests:
          - not_null
      - name: precipitation_mm
        data_tests:
          - not_null
  - name: dim_location
    description: "One row per location. Name, province, and region from the locations seed, plus coordinates from the weather data."
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null
  - name: dim_date
    description: "One row per calendar day from 2026-01-01 to 2027-12-31. Use for filtering and grouping by day, month, or weekend."
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
  - name: fct_weather_hourly
    description: "One row per location per hour, latest forecast only. Measures: temperature, humidity, precipitation. Joins to dim_location and dim_date."
    columns:
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day      
  - name: weather_hourly_history
    description: "One row per location per hour per load, all loads kept. Use to compare how the forecast changed over time."
    columns:
      - name: file_name
        data_tests:
          - not_null
      - name: observed_at
        data_tests:
          - not_null
      - name: temperature_c
        data_tests:
          - not_null
  - name: fct_weather_daily
    description: "One row per location per day, aggregated from fct_weather_hourly. rain_hours = hours with precipitation_mm > 0; hot_hours = hours with temperature_c >= 32."
    columns:
      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day        