version: 2

models:
  - name: weather_hourly
    description: "One row per location per hour, keeping only the latest forecast. Use for current forecast reporting and dashboards."
    columns:
      - name: observed_at
        data_tests:
          - not_null
      - name: latitude
        data_tests:
          - not_null
      - name: temperature_c
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null
      - name: humidity_pct
        data_tests:
          - not_null
      - name: precipitation_mm
        data_tests:
          - not_null
  - name: weather_hourly_history
    description: "One row per location per hour per load, all loads kept. Use to compare how the forecast changed over time."
  - name: dim_location
    description: "One row per location. Name, province, and region from the locations seed, plus coordinates from the weather data."
    columns:
      - name: location_id
        data_tests:
          - unique
          - not_null