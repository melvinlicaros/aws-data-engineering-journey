version: 2

models:
  - name: weather_hourly
    description: "Pinakabagong forecast kada lugar at oras"
    columns:
      - name: observed_at
        data_tests:
          - not_null
      - name: latitude
        data_tests:
          - not_null
      - name: temperature_c
        data_tests:
          - not_null
      - name: longitude
        data_tests:
          - not_null
      - name: humidity_pct
        data_tests:
          - not_null
      - name: precipitation_mm
        data_tests:
          - not_null