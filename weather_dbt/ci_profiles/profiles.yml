weather_dbt:                    
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: PIPELINE_ROLE
      warehouse: WEATHER_WH
      database: WEATHER_DB
      schema: DBT_PROD
      threads: 4
    
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}" 
      role: PIPELINE_ROLE
      warehouse: WEATHER_WH
      database: WEATHER_DB
      schema: DBT_CI
      threads: 4