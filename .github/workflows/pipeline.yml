name: Weather Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: palitan ang v4 ng v5

      - name: Set up Python
        uses: palitan ang v5 ng v6
        with:
          python-version: "3.14"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Check setup
        run: |
          python --version
          dbt --version