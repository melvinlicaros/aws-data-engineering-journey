name: Weather Pipeline

on:
  workflow_dispatch:
  schedule:
  cron: "17 22 ***"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY_PATH: ${{ github.workspace }}/rsa_key.p8

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Write private key to file
        run: |
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" > rsa_key.p8
          chmod 600 rsa_key.p8

      - name: Fetch weather data
        run: |
          mkdir -p data
          python week01-python/fetch_weather.py

      - name: Load to Snowflake
        run: python week02-snowflake/load_weather.py

      - name: dbt build (prod)
        working-directory: weather_dbt
        run: dbt build --profiles-dir ci_profiles